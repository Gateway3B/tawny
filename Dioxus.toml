[application]
name = "tawny"
asset_dir = "assets"
default_platform = "web"
out_dir = "dist"
tailwind_input = "tailwind.css"
tailwind_output = "assets/tailwind.css"

[web.app]
title = "Tawny"

[web.watcher]
reload_html = true
watch_path = ["src", "assets"]

[web.resource]
style = []
script = []

[web.resource.dev]
script = []

[bundle]
identifier = "net.gateway3.tawny"
publisher = "Gateway3"
category = "Entertainment"
short_description = "A calm, local-first YouTube client."
long_description = "Tawny is a self-hosted YouTube client for personal home labs, on mobile, web, and desktop."

[ios]
deployment_target = "15.0"
# The media plugin's `.playback` audio session only survives leaving the app
# when the Info.plist declares background audio.
background_modes = ["audio"]

[android]
min_sdk = 35
target_sdk = 35
compile_sdk = 35
