name: Rust readability

on: [push, pull_request]

permissions:
  contents: read

jobs:
  readability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node --test scripts/rust-style.test.mjs
      - run: node scripts/rust-style.mjs
