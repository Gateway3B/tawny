name: Build Mobile Artifacts

run-name: Build ${{ inputs.platform }} mobile artifacts for ${{ inputs.server_url }}

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native platform to compile
        required: true
        default: both
        type: choice
        options:
          - both
          - android
          - ios
      server_url:
        description: HTTPS Tawny server origin to compile into the app
        required: true
        type: string

concurrency:
  group: build-mobile-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SERVER_URL: ${{ inputs.server_url }}

jobs:
  android:
    name: Android APK and AAB
    if: inputs.platform == 'both' || inputs.platform == 'android'
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install Java 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install web asset dependencies
        run: npm ci

      - name: Fetch dependencies
        run: cargo fetch --locked

      # dx must come from the same Dioxus fork as the libraries, or the app
      # fails to hydrate; the fork publishes no binaries yet.
      - name: Install Dioxus CLI
        run: cargo install --git https://github.com/Gateway3B/dioxus --branch main dioxus-cli --locked

      - name: Validate compiled configuration
        shell: bash
        run: |
          set -euo pipefail
          : "${SERVER_URL:?Enter the production HTTPS origin when dispatching the workflow}"
          [[ "$SERVER_URL" == https://* ]] || {
            echo "server_url must be an HTTPS origin" >&2
            exit 1
          }

      # Optional: sign with the Play upload key when its secrets exist,
      # otherwise build unsigned. dx reads the keystore and passwords only from
      # `[android.signing]` in Dioxus.toml, so the section is appended to the
      # runner's copy here and never committed. The keystore is written outside
      # the checkout.
      - name: Configure Android upload signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "No upload keystore configured; building unsigned bundles."
            exit 0
          fi
          : "${ANDROID_KEYSTORE_PASSWORD:?Configure ANDROID_KEYSTORE_PASSWORD with the keystore}"
          : "${ANDROID_KEY_ALIAS:?Configure ANDROID_KEY_ALIAS with the keystore}"
          : "${ANDROID_KEY_PASSWORD:?Configure ANDROID_KEY_PASSWORD with the keystore}"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/upload-keystore.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
          # JSON string escapes are valid TOML basic strings, so any password
          # characters survive.
          node --input-type=module <<'JS'
          import { appendFileSync } from "node:fs";
          const keys = {
            jks_file: process.env.ANDROID_KEYSTORE_FILE,
            jks_password: process.env.ANDROID_KEYSTORE_PASSWORD,
            key_alias: process.env.ANDROID_KEY_ALIAS,
            key_password: process.env.ANDROID_KEY_PASSWORD,
          };
          let config = "\n[android.signing]\n";
          for (const [key, value] of Object.entries(keys)) {
            config += `${key} = ${JSON.stringify(value)}\n`;
          }
          appendFileSync("Dioxus.toml", config, "utf8");
          JS

      # The build number must rise with every store upload; the run number does.
      # Only `artifacts/` is uploaded: the generated Gradle project under
      # `target/` holds the signing passwords.
      - name: Build Android release bundles
        env:
          DX_ANDROID_VERSION_CODE: ${{ github.run_number }}
          DX_BUNDLE_VERSION: ${{ github.run_number }}
        run: >
          dx bundle --android --release --locked --no-default-features
          --fullstack false --package-types apk --package-types aab
          --out-dir artifacts/android

      - name: Upload Android artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tawny-android-${{ github.sha }}
          path: artifacts/android/
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS IPA
    if: inputs.platform == 'both' || inputs.platform == 'ios'
    # App Store Connect only accepts builds made with the iOS 26 SDK (Xcode 26)
    # since 2026-04-28. macos-15 defaults to Xcode 16, and the SDK is recorded
    # in the bundle, so re-signing an IPA built there cannot fix it.
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fails here, not at upload, if the image's default Xcode ever moves back.
      - name: Require Xcode 26 or newer
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          major="$(xcodebuild -version | awk 'NR == 1 { split($2, v, "."); print v[1] }')"
          [[ "$major" -ge 26 ]] || {
            echo "App Store uploads need Xcode 26 or newer; this runner selects Xcode $major" >&2
            exit 1
          }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          targets: aarch64-apple-ios

      - name: Install web asset dependencies
        run: npm ci

      - name: Fetch dependencies
        run: cargo fetch --locked

      # dx must come from the same Dioxus fork as the libraries, or the app
      # fails to hydrate; the fork publishes no binaries yet.
      - name: Install Dioxus CLI
        run: cargo install --git https://github.com/Gateway3B/dioxus --branch main dioxus-cli --locked

      - name: Validate compiled configuration
        shell: bash
        run: |
          set -euo pipefail
          : "${SERVER_URL:?Enter the production HTTPS origin when dispatching the workflow}"
          [[ "$SERVER_URL" == https://* ]] || {
            echo "server_url must be an HTTPS origin" >&2
            exit 1
          }

      # Optional: sign for the App Store when the distribution certificate and
      # profile exist in secrets, otherwise build unsigned. The certificate goes
      # into a temporary keychain that is deleted when the job ends.
      - name: Configure App Store signing
        id: ios-signing
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" ]]; then
            echo "No distribution certificate configured; building unsigned."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          : "${IOS_DISTRIBUTION_CERTIFICATE_PASSWORD:?Configure IOS_DISTRIBUTION_CERTIFICATE_PASSWORD with the certificate}"
          : "${IOS_APPSTORE_PROFILE_BASE64:?Configure IOS_APPSTORE_PROFILE_BASE64 with the certificate}"

          keychain="$RUNNER_TEMP/app-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          certificate="$RUNNER_TEMP/distribution.p12"
          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          # dx finds the identity with `security find-identity`, which only
          # searches the user's keychain list.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$certificate"

          # dx reads profiles from Xcode 16's folder when it exists, else the
          # older one; install into both.
          for folder in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" \
            "$HOME/Library/MobileDevice/Provisioning Profiles"; do
            mkdir -p "$folder"
            printf '%s' "$IOS_APPSTORE_PROFILE_BASE64" | base64 --decode > "$folder/tawny-appstore.mobileprovision"
          done
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"
          echo "configured=true" >> "$GITHUB_OUTPUT"

      # The build number must rise with every store upload; the run number does.
      - name: Build iOS release bundle
        env:
          DX_ANDROID_VERSION_CODE: ${{ github.run_number }}
          DX_BUNDLE_VERSION: ${{ github.run_number }}
          SIGNED: ${{ steps.ios-signing.outputs.configured }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$SIGNED" == true ]]; then
            signing=(--appstore)
          else
            signing=(--codesign false)
          fi
          dx bundle --ios --release --locked --no-default-features \
            --fullstack false --package-types ipa "${signing[@]}" \
            --out-dir artifacts/ios

      - name: Remove signing keychain
        if: always() && steps.ios-signing.outputs.keychain != ''
        env:
          KEYCHAIN: ${{ steps.ios-signing.outputs.keychain }}
        run: security delete-keychain "$KEYCHAIN"

      - name: Upload iOS artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tawny-ios-${{ github.sha }}
          path: artifacts/ios/
          if-no-files-found: error
          retention-days: 14
