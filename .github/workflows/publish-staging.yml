name: Publish images

# Follows the same shape as g3-ui's publish-playground-image.yml, with one
# difference: Tawny needs two images, not one. compose builds the extractor
# sidecar from docker/extractor, so publishing only the app would leave a
# pull-only deployment unable to start.
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-staging.yml"
      - ".dockerignore"
      - "assets/**"
      - "database/**"
      - "compose.prod.yml"
      - "docker/**"
      - "src/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "Dioxus.toml"
      - "Dockerfile"
      - "package-lock.json"
      - "package.json"
      - "rust-toolchain.toml"
      - "tailwind.css"
  workflow_dispatch:

concurrency:
  group: publish-images-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: ${{ matrix.title }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    strategy:
      # Independent images. One failing should not hide whether the other built.
      fail-fast: false
      matrix:
        include:
          - title: Tawny server
            image: ghcr.io/gateway3b/tawny
            context: .
            dockerfile: Dockerfile
          - title: Extractor sidecar
            image: ghcr.io/gateway3b/tawny-extractor
            context: ./docker/extractor
            dockerfile: ./docker/extractor/Dockerfile

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha

      - name: Build candidate image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: tawny-local-candidate:test
          labels: ${{ steps.meta.outputs.labels }}

      - name: Publish image
        env:
          PUBLISH_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          test -n "$PUBLISH_TAGS"
          while IFS= read -r tag; do
            test -n "$tag" || continue
            docker tag tawny-local-candidate:test "$tag"
            docker push "$tag"
          done <<< "$PUBLISH_TAGS"
