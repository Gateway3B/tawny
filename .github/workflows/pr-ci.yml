name: PR CI

on:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Formatting and web quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: rustfmt

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version
          node --version
          npm --version

      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          npm run format:web:check

      - name: Run web checks
        run: |
          npm run test:unit
          npm run lint:web
          python -m unittest discover -s ci -p "test_*.py"

      - name: Check whitespace
        run: git diff --check

  rust:
    name: Rust (${{ matrix.profile }})
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout-minutes }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: default
            cargo-args: ""
            test: true
            timeout-minutes: 15
          - profile: server
            cargo-args: --no-default-features --features server
            test: true
            timeout-minutes: 30
          - profile: mobile
            cargo-args: --no-default-features --features mobile
            test: false
            timeout-minutes: 15
          - profile: desktop
            cargo-args: --no-default-features --features desktop
            test: false
            timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: clippy

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install Dioxus Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Fetch private dependencies
        uses: ./.github/actions/private-dependencies
        with:
          client-id: ${{ vars.G3_DEPENDENCIES_APP_CLIENT_ID }}
          private-key: ${{ secrets.G3_DEPENDENCIES_APP_PRIVATE_KEY }}

      - name: Check build
        run: cargo check --locked --offline ${{ matrix.cargo-args }}

      # Every feature set: code gated to one build is only linted by that build.
      - name: Run Clippy
        run: cargo clippy --locked --offline --all-targets --no-deps ${{ matrix.cargo-args }} -- -D warnings

      - name: Run Rust tests
        if: matrix.test
        run: cargo test --locked --offline ${{ matrix.cargo-args }}

      - name: Verify database-editor privacy operations over WebSocket
        if: matrix.profile == 'server'
        run: python3 ci/privacy_auth_drill.py
