name: PR CI

on:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Formatting and web quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: rustfmt

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version
          node --version
          npm --version

      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          npm run format:web:check

      - name: Run web checks
        run: |
          npm run test:unit
          npm run lint:web

      - name: Check whitespace
        run: git diff --check

  rust:
    name: Rust (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout-minutes }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: default
            cargo-args: ""
            test: true
            timeout-minutes: 15
          - profile: server
            cargo-args: --no-default-features --features server
            test: true
            timeout-minutes: 30
          - profile: mobile
            cargo-args: --no-default-features --features mobile
            test: false
            timeout-minutes: 15
          - profile: desktop
            cargo-args: --no-default-features --features desktop
            test: false
            timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: clippy

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install Dioxus Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Fetch dependencies
        run: cargo fetch --locked

      - name: Check build
        run: cargo check --locked --offline ${{ matrix.cargo-args }}

      # Every feature set: code gated to one build is only linted by that build.
      - name: Run Clippy
        run: cargo clippy --locked --offline --all-targets --no-deps ${{ matrix.cargo-args }} -- -D warnings

      - name: Run Rust tests
        if: matrix.test
        run: cargo test --locked --offline ${{ matrix.cargo-args }}

  ios:
    # The Linux matrix above builds `mobile` for the host, so code behind
    # `target_os = "ios"` (and the iOS halves of the g3 crates) is never
    # compiled there. Four iOS-only compile errors shipped that way.
    name: Rust (iOS)
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Same guard as the release build, so this lints against the SDK the
      # IPA is built with (g3-native-plugins compiles its Swift with it).
      - name: Require Xcode 26 or newer
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          major="$(xcodebuild -version | awk 'NR == 1 { split($2, v, "."); print v[1] }')"
          [[ "$major" -ge 26 ]] || {
            echo "This job needs Xcode 26 or newer; this runner selects Xcode $major" >&2
            exit 1
          }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          targets: aarch64-apple-ios
          components: clippy

      - name: Fetch dependencies
        run: cargo fetch --locked

      # Same as `just lint-ios`.
      - name: Run Clippy for iOS
        run: >
          cargo clippy --locked --offline --target aarch64-apple-ios
          --no-default-features --features mobile --no-deps -- -D warnings
