name: PR CI

on:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Formatting and web quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: rustfmt

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version
          node --version
          npm --version

      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          npm run format:web:check

      - name: Run web checks
        run: |
          npm run test:unit
          npm run lint:web

      - name: Check whitespace
        run: git diff --check

  rust:
    name: Rust (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout-minutes }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: default
            cargo-args: ""
            test: true
            timeout-minutes: 15
          - profile: server
            cargo-args: --no-default-features --features server
            test: true
            timeout-minutes: 30
          - profile: mobile
            cargo-args: --no-default-features --features mobile
            test: false
            timeout-minutes: 15
          - profile: desktop
            cargo-args: --no-default-features --features desktop
            test: false
            timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: clippy

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install Dioxus Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ matrix.profile }}

      - name: Check build
        run: cargo check ${{ matrix.cargo-args }}

      # Every feature set: code gated to one build is only linted by that build.
      - name: Run Clippy
        run: cargo clippy --all-targets --no-deps ${{ matrix.cargo-args }} -- -D warnings

      - name: Run Rust tests
        if: matrix.test
        run: cargo test ${{ matrix.cargo-args }}
