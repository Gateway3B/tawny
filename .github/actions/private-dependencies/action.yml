name: Fetch private Rust dependencies
description: Fetch pinned sources with short-lived access scoped to g3-brand
inputs:
  client-id:
    description: GitHub App client ID
    required: true
  private-key:
    description: GitHub App private key
    required: true
runs:
  using: composite
  steps:
    - name: Get scoped dependency access
      id: token
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        owner: g3techhq
        repositories: g3-brand
        permission-contents: read
    - name: Fetch locked dependencies before long compilation
      shell: bash
      env:
        G3_BRAND_READ_TOKEN: ${{ steps.token.outputs.token }}
        GIT_TERMINAL_PROMPT: '0'
        CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        GIT_CONFIG_COUNT: '3'
        GIT_CONFIG_KEY_0: credential.helper
        GIT_CONFIG_VALUE_0: ''
        GIT_CONFIG_KEY_1: credential.helper
        # Cargo runs Git from its source cache, not the checkout directory.
        GIT_CONFIG_VALUE_1: '!sh "${{ github.workspace }}/ci/private-git-credential.sh"'
        GIT_CONFIG_KEY_2: credential.useHttpPath
        GIT_CONFIG_VALUE_2: 'true'
      run: cargo fetch --locked
