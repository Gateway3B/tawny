<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Tawny">
  <!-- The header's brand mark at icon scale: the same amber gradient and the
       same slightly uneven corner radii, which are what make the shape read as
       Tawny. The owl is the app icon's (assets/icon/icon.svg), in its
       coordinates, scaled into the middle. -->
  <defs>
    <linearGradient id="tawny-mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc45d"/>
      <stop offset="1" stop-color="#d97816"/>
    </linearGradient>
  </defs>
  <path d="M20 2h24a18 18 0 0 1 18 18v21a21 21 0 0 1-21 21H21A19 19 0 0 1 2 43V20A18 18 0 0 1 20 2z" fill="url(#tawny-mark)"/>
  <g transform="translate(33 32) scale(0.075) translate(-541 -480)">
    <path d="M366 708 L366 252 L420 330 L470 300 L500 368 L716 512 Z" fill="#231509" stroke="#231509" stroke-width="64" stroke-linejoin="round"/>
    <circle cx="430" cy="506" r="66" fill="#fff1d6"/>
    <circle cx="558" cy="506" r="66" fill="#fff1d6"/>
    <circle cx="446" cy="510" r="34" fill="#231509"/>
    <circle cx="574" cy="510" r="34" fill="#231509"/>
  </g>
</svg>
