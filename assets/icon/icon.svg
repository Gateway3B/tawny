<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Tawny app icon</title>
  <!-- App icon master: full bleed, since every platform applies its own
       mask. The mark stays inside the centre 62%, which keeps it within
       Android's adaptive-icon safe zone. Render the PNG files with g3-stack's
       scripts/app-icon.mjs. -->
  <defs>
    <linearGradient id="tawny-mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc45d"></stop>
      <stop offset="1" stop-color="#d97816"></stop>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="#f0a03a"/>
  <g transform="translate(534 512) scale(19.2534) translate(-36.105 -30.700)">
    <path d="M26 20.5a2 2 0 0 1 3.03-1.72l16.2 10.2a2 2 0 0 1 0 3.44l-16.2 10.2A2 2 0 0 1 26 40.9z" fill="#231509"></path>
  </g>
</svg>
