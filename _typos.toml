[files]
extend-exclude = [
    "target/**",
    "node_modules/**",
    "playwright-report/**",
    "test-results/**",
    "assets/tailwind.css",
    "info_site/tailwind.css",
]

[default.extend-words]
# The Python CA bundle package the on-device resolver installs.
certifi = "certifi"
dioxus = "dioxus"
partee = "partee"
# A crate named in the upstream Dioxus notes (docs/dioxus/architecture).
ratatui = "ratatui"
# The media element event, not a misspelling of "sought".
seeked = "seeked"
surreal = "surreal"
surrealdb = "surrealdb"
tourney = "tourney"
