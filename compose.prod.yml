name: tawny

# Pull-only deployment, for Portainer or any `docker compose up -d` host.
#
# `latest` images, `pull_policy: always` so a stack redeploy actually picks up
# a new build, and container names so the Portainer UI is readable. Sits beside
# compose.yml rather than in a deploy/ directory, matching the other apps in
# this stack; g3-ui still keeps its equivalent under deploy/.
#
# The difference from compose.yml is that nothing is built here: both images
# come from GHCR, published by .github/workflows/publish-staging.yml. A host
# running this needs no Rust toolchain, no Node, and no copy of the source.
#
# Only Tawny itself publishes a port. SurrealDB, the PO-token provider and the
# extractor sidecar talk to it over the compose network and have no reason to be
# reachable from outside it - the development compose file exposes them on
# 127.0.0.1 so a host `dx serve` can reach them, which is not a deployment need.

# Bounded container logs. The json-file driver has no cap by default, and a
# chatty container can fill the host disk, which takes the database down with
# it. The extractor is the one to watch: yt-dlp narrates every download.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"
    tag: "{{.Name}}"

services:
  surrealdb-init:
    image: busybox:1.37
    user: "0:0"
    command: ["chown", "-R", "65532:65532", "/data"]
    volumes:
      - ${TAWNY_SURREALDB_VOLUME:-surrealdb-data}:/data
    restart: "no"

  surrealdb:
    image: surrealdb/surrealdb:v${SURREALDB_VERSION:-3.2.4}
    container_name: tawny-surrealdb
    mem_limit: ${SURREALDB_MEMORY_LIMIT:-2g}
    command:
      - start
      - --log
      - info
      - --user
      - ${SURREALDB_USER:-root}
      # No default, deliberately. A deployed database with the password "root"
      # is worse than a stack that refuses to start with a readable message.
      - --pass
      - ${SURREALDB_PASSWORD:?set SURREALDB_PASSWORD to something private}
      - surrealkv:///data/surrealkv
    working_dir: /data
    volumes:
      - ${TAWNY_SURREALDB_VOLUME:-surrealdb-data}:/data
    depends_on:
      surrealdb-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/surreal", "isready", "--endpoint", "http://127.0.0.1:8000"]
      interval: 5s
      timeout: 4s
      retries: 12
    logging: *default-logging
    restart: unless-stopped

  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:${POT_PROVIDER_VERSION:-2.0.0}
    container_name: tawny-pot-provider
    init: true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4416/ping').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 4s
      start_period: 10s
      retries: 6
    logging: *default-logging
    restart: unless-stopped

  extractor:
    image: ghcr.io/g3techhq/tawny-extractor:${TAWNY_IMAGE_TAG:-latest}
    container_name: tawny-extractor
    pull_policy: always
    environment:
      PO_TOKEN_PROVIDER_URL: http://pot-provider:4416
      MAX_CONCURRENT_EXTRACTIONS: ${YTDLP_CONCURRENCY:-2}
    init: true
    depends_on:
      pot-provider:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"
      interval: 10s
      timeout: 4s
      start_period: 10s
      retries: 6
    logging: *default-logging
    restart: unless-stopped

  tawny:
    image: ghcr.io/g3techhq/tawny:${TAWNY_IMAGE_TAG:-latest}
    container_name: tawny
    pull_policy: always
    init: true
    environment:
      SURREALDB_HOST: ws://surrealdb:8000
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-}
      SURREALDB_NAMESPACE: ${SURREALDB_NAMESPACE:-tawny}
      SURREALDB_NAME: ${SURREALDB_NAME:-main}
      SURREALDB_USER: ${SURREALDB_USER:-root}
      SURREALDB_PASSWORD: ${SURREALDB_PASSWORD:?set SURREALDB_PASSWORD to something private}
      TAWNY_YTDLP_SERVICE_URL: http://extractor:8080
      # The origin browsers will actually reach this instance on. It is what
      # proxy URLs and WebSub lease callbacks are built from, so a wrong value
      # shows up as broken playback rather than as a configuration error.
      TAWNY_PUBLIC_URL: ${TAWNY_PUBLIC_URL:?set TAWNY_PUBLIC_URL to the origin this is served on}
      TAWNY_WEBSUB_CALLBACK_URL: ${TAWNY_WEBSUB_CALLBACK_URL:-}
      # Optional. Left empty, Tawny generates one and keeps it on the app
      # volume. That is fine only as long as that volume survives: replace the
      # volume and every existing YouTube subscription fails its signature
      # check until it renews. Set it explicitly if the data may ever move.
      TAWNY_WEBSUB_SECRET: ${TAWNY_WEBSUB_SECRET:-}
    ports:
      - "${TAWNY_PORT:-8080}:8080"
    volumes:
      - ${TAWNY_APP_VOLUME:-tawny-data}:/data
    networks: [default, proxy]
    depends_on:
      surrealdb:
        condition: service_healthy
      extractor:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 4s
      start_period: 15s
      retries: 6
    logging: *default-logging
    restart: unless-stopped

volumes:
  surrealdb-data:
  tawny-data:

# Only Tawny joins `proxy`, because only Tawny is worth reaching from outside
# the stack. By default it is an ordinary network this stack owns, so a plain
# `up` needs no setup and no knowledge of anyone's proxy. Point it at an
# existing network to put Tawny on one, which lets a reverse proxy in that
# network reach it as `tawny:8080` and lets you drop the published port:
#
#   TAWNY_PROXY_NETWORK=npm_default
#   TAWNY_PROXY_NETWORK_EXTERNAL=true
#
# `external` says the network already exists and this stack must not create or
# remove it. Both variables move together; naming an existing network without
# setting `external` makes Compose try to create it and fail.
networks:
  default:
  proxy:
    name: ${TAWNY_PROXY_NETWORK:-tawny-proxy}
    external: ${TAWNY_PROXY_NETWORK_EXTERNAL:-false}
