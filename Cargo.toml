[package]
name = "tawny"
version = "0.1.0"
authors = ["Matthew Weisfeld <matthewedwardweisfeld@gmail.com>"]
edition = "2024"
rust-version = "1.90.0"
description = "A local-first, cross-platform YouTube client built with Dioxus."
publish = false
repository = "https://github.com/Gateway3B/tawny"

[dependencies]
dioxus = { version = "=0.8.0-alpha.3", features = ["router", "fullstack"] }
dioxus-fullstack = "=0.8.0-alpha.3"
dioxus-icons = "=0.2.0-alpha.3"
g3-route-transitions = { version = "0.5", features = ["native-back"] }
g3-native-plugins = { version = "0.4.4", features = ["external-url", "appearance", "back-button", "clipboard", "media", "safe-area", "storage"] }
g3-ui = { version = "0.6", features = ["transitions"] }
g3-auth = { version = "0.2", features = ["record-id"] }
g3-cache = "0.2.0"
manganis = "=0.8.0-alpha.3"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.140"
surrealdb-types = { version = "=3.2.4" }
cfg-if = "1.0.0"

# Server-only
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "json", "env-filter"], optional = true }
tokio = { version = "1.42.0", features = ["full"], optional = true }
axum = { version = "0.8.9", optional = true }
axum_session = { version = "0.20.1", optional = true }
axum_session_auth = { version = "0.20.0", optional = true }
async-trait = { version = "0.1.88", optional = true }
# No provider of its own: the server feature adds `rustls` (aws-lc-rs), while
# the phone uses the ring provider `dioxus::launch` installs, so mobile builds
# compile no aws-lc C code.
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "query", "rustls-no-provider", "stream"], optional = true }
surrealdb = { version = "=3.2.4", features = ["kv-mem"], optional = true }
surrealkit = { version = "=0.6.3", default-features = false, optional = true }
anyhow = { version = "1.0.98", optional = true }
dotenvy = { version = "0.15.7", optional = true }
quick-xml = { version = "0.37.5", optional = true }
rustypipe = { version = "0.11.4", default-features = false, features = ["rustls-tls-native-roots", "rss"], optional = true }
hmac = { version = "0.12.1", optional = true }
sha1 = { version = "0.10.6", optional = true }
hex = { version = "0.4.3", optional = true }
base64 = { version = "0.22.1", optional = true }
futures-util = { version = "0.3.31", optional = true }
rand = { version = "0.9.2", optional = true }
# Passwords are hashed with Argon2id. `sha2` is also used for SponsorBlock
# lookup hashes and YouTube playback identifiers; `rand` mints the WebSub
# callback secret.
argon2 = { version = "0.5", optional = true }
sha2 = { version = "0.10", optional = true }
# Group suggestions run a small sentence-embedding model on the server
# (`src/server/topics.rs`). Candle is pure Rust, so the same code can later
# build for phones; the tokenizer leaves out its C regex and suffix-array
# libraries for the same reason.
candle-core = { version = "0.11.1", optional = true }
candle-nn = { version = "0.11.1", optional = true }
candle-transformers = { version = "0.11.1", optional = true }
tokenizers = { version = "0.22.2", default-features = false, features = ["fancy-regex"], optional = true }
time = { version = "0.3.55", features = ["parsing"] }
web-time = "1.1.0"

# The backend URL has to be known before `dioxus::launch`, because the first
# render already calls server functions. That rules out the localStorage helper
# in `cache`, which needs a running app to eval, so each client platform reads
# its own store directly instead.
web-sys = { version = "0.3", features = ["Location", "Storage", "Window"], optional = true }
dirs = { version = "6", optional = true }

# Resolving playback on an Android phone (`src/local_streams.rs`) calls its
# Kotlin module through JNI, as g3-native-plugins does.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"
ndk-context = "0.1.1"
# The local relay's TLS roots; see `local_relay::client`.
webpki-root-certs = "1"

[features]
default = ["web"]
web = ["dioxus/web", "dep:web-sys", "g3-cache/web"]
desktop = ["dioxus/desktop", "dep:dirs", "g3-auth/desktop", "g3-cache/desktop"]
mobile = [
    "dioxus/mobile",
    "tokio",
    "dep:dirs",
    "g3-auth/mobile",
    "g3-cache/mobile",
    # The local relay that hands streams resolved on the phone to the player.
    "reqwest",
]
server = [
    "dep:tracing",
    "dep:tracing-subscriber",
    "dioxus/server",
    "g3-auth/server",
    "g3-auth/rate-limit",
    "g3-cache/server",
    "tokio",
    "axum",
    "axum_session",
    "axum_session_auth",
    "async-trait",
    "reqwest",
    "reqwest/rustls",
    "surrealdb",
    "surrealkit",
    "anyhow",
    "dotenvy",
    "quick-xml",
    "rustypipe",
    "hmac",
    "sha1",
    "hex",
    "base64",
    "futures-util",
    "rand",
    "argon2",
    "sha2",
    "candle-core",
    "candle-nn",
    "candle-transformers",
    "tokenizers",
]

# surrealdb-core is most of the database engine; even the remote client
# depends on it for its wire types. Its debug info runs past a gigabyte and is
# relinked on every server build, and nobody steps through it.
[profile.dev.package.surrealdb-core]
debug = false

[profile.dev.package.surrealdb]
debug = false

[profile.wasm-dev]
inherits = "dev"
opt-level = 1
# Without debug info the dev wasm drops from ~220 MB to ~18 MB, and the
# wasm-bindgen pass dx runs on every rebuild from ~22s to ~2s. Panics and
# stack traces keep their file, line and function names.
debug = 0

[profile.server-dev]
inherits = "dev"
# Line tables keep backtraces readable and cut several seconds off each dx
# server rebuild. Switch to full debug info when attaching a debugger.
debug = "line-tables-only"

[profile.android-dev]
inherits = "dev"
debug = 0
strip = "debuginfo"

# dx builds release clients with these names (and the server with
# `server-release`, left on Cargo's defaults so it keeps unwinding). Without
# them the wasm gets Cargo's release defaults: measured on media-mancer, these
# settings cut the brotli download by about a quarter.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false

[profile.android-release]
inherits = "release"
# Phones run the UI here; CPU matters more than size.
opt-level = 3
lto = "fat"
codegen-units = 1

[profile.ios-release]
inherits = "android-release"

[target.wasm32-unknown-unknown.dependencies.getrandom_v03]
package = "getrandom"
version = "0.3.3"
features = ["wasm_js"]

[target.wasm32-unknown-unknown.dependencies.getrandom_v02]
package = "getrandom"
version = "0.2"
features = ["js"]

[patch.crates-io]
# Dioxus fork (upstream main + g3 commits; see G3-PATCHES.md there). Local
# builds use the sibling checkouts via Projects/.cargo/config.toml.
dioxus = { git = "https://github.com/Gateway3B/dioxus", branch = "main" }
dioxus-fullstack = { git = "https://github.com/Gateway3B/dioxus", branch = "main" }
dioxus-ssr = { git = "https://github.com/Gateway3B/dioxus", branch = "main" }
dioxus-signals = { git = "https://github.com/Gateway3B/dioxus", branch = "main" }
manganis = { git = "https://github.com/Gateway3B/dioxus", branch = "main" }
# dioxus-icons asks for these two by name from crates.io.
dioxus-vdom-template = { git = "https://github.com/Gateway3B/dioxus", branch = "main" }
lazy-js-bundle = { git = "https://github.com/Gateway3B/dioxus", branch = "main" }
# Published 0.2.0-alpha.3 still depends on `dioxus-core-template`, which the
# upstream rename removed.
dioxus-icons = { git = "https://github.com/Gateway3B/dioxus-icons", branch = "main" }
# g3-auth's desktop and mobile cookie stores; no 0.8 release upstream.
dioxus-cookie = { git = "https://github.com/Gateway3B/dioxus-cookie", branch = "main" }
# g3-ui uses it. Published 0.8.0-alpha.3 still names the old
# `dioxus::dioxus_core` paths, which the fork no longer has.
dioxus-sdk-time = { git = "https://github.com/Gateway3B/sdk", branch = "main" }
# g3 crates are not published until Dioxus 0.8.0:
g3-auth = { git = "https://github.com/g3techhq/g3-auth", branch = "main" }
g3-cache = { git = "https://github.com/g3techhq/g3-cache", branch = "main" }
g3-native-plugins = { git = "https://github.com/g3techhq/g3-native-plugins", branch = "main" }
g3-route-transitions = { git = "https://github.com/g3techhq/g3-route-transitions", branch = "main" }
g3-ui = { git = "https://github.com/g3techhq/g3-ui", branch = "main" }

[dev-dependencies]
dioxus-ssr = "=0.8.0-alpha.3"
# The server build compiles the Android relay to test it.
webpki-root-certs = "1"
tower = { version = "0.5", features = ["util"] }
